title = "ElasticViT"

[kernel_size]
dynamic_batch_size = 1
epochs = 120
opt = "adamw"
lr = 1e-4
warmup_epochs = 5
warmup_lr = -1
enable_dimensions = ["kernel_size"]
enable_index = [0, 1]
mixup_active = true
model_ema = true

[v_scale.phase0]
dynamic_batch_size = 2
epochs = 25
opt = "adamw"
lr = 1e-4
warmup_epochs = 0
warmup_lr = -1
enable_dimensions = ["kernel_size", "v_scale"]
enable_index = [1, 2]
mixup_active = true
model_ema = true

[v_scale.phase1]
